name: Rivvo Reel Publisher

on:
  # schedule paused: automatic reels are switched off (run manually with "Run workflow" if wanted)
  #schedule:
    #
    #- cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rivvo-reel-publisher
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core libraqm0
          pip install pillow requests
      - name: Make and publish today's reel
        env:
          RIVVO_SOCIAL_CRON_SECRET: ${{ secrets.RIVVO_SOCIAL_CRON_SECRET }}
        run: |
          test -n "$RIVVO_SOCIAL_CRON_SECRET"
          python scripts/make_reel.py
