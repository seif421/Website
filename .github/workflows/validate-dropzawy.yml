name: Validate Dropzawy importer

on:
  push:
    branches:
      - feature/dropzawy-product-importer

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dropzawy-product-importer
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format changed files
        run: bunx prettier --write src/routes/_authenticated/admin/dropzawy.tsx src/components/admin/admin-sidebar.tsx
      - name: Lint changed files
        run: bunx eslint src/routes/_authenticated/admin/dropzawy.tsx src/components/admin/admin-sidebar.tsx
      - name: Production build (regenerates TanStack route tree)
        run: bun run build
      - name: TypeScript check
        run: bunx tsc --noEmit
      - name: Commit generated route tree and remove temporary workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/admin/dropzawy.tsx src/components/admin/admin-sidebar.tsx src/routeTree.gen.ts
          git rm .github/workflows/validate-dropzawy.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: validate Dropzawy importer and update route tree"
            git push origin feature/dropzawy-product-importer
          fi
