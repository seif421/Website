name: Format Dropzawy importer

on:
  push:
    branches:
      - feature/dropzawy-product-importer

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dropzawy-product-importer
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/routes/_authenticated/admin/dropzawy.tsx src/components/admin/admin-sidebar.tsx
      - name: Commit formatting and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/admin/dropzawy.tsx src/components/admin/admin-sidebar.tsx
          git rm .github/workflows/format-dropzawy.yml
          if ! git diff --cached --quiet; then
            git commit -m "style: format Dropzawy importer"
            git push origin feature/dropzawy-product-importer
          fi
